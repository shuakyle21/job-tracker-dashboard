name: Build and deploy

on:
  # Data refresh. Minute 17 rather than 0 on purpose: GitHub's scheduler is busiest
  # on the hour and jobs queued then run latest. Treat this as "a few times a day",
  # never "at exactly this time" — Actions cron is best-effort.
  schedule:
    - cron: "17 */6 * * *"

  # Code changes.
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/deploy.yml"

  # Manual run from the Actions tab — how you'll test the first deploy.
  workflow_dispatch:

  # Event-driven refresh. n8n POSTs here whenever Airtable pings it that Feed
  # changed (hand edits and the Gmail ingest's writes alike), so the dashboard
  # updates within seconds instead of waiting for the cron.
  repository_dispatch:
    types: [tracker-updated]

permissions:
  contents: write   # to commit data/summary.json

# A scheduled run and a dispatch can overlap. Let the newer one win rather than
# racing two deploys against the same Vercel project.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Which path fired this run. "airtable-webhook" means Feed changed, from a
      # hand edit or the Gmail ingest's upsert. Passed through env, never
      # interpolated into the script, because the payload is caller-supplied.
      - name: Trigger source
        env:
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ github.event.client_payload.source }}
        run: echo "event=$EVENT source=${SOURCE:-n/a}"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Gate. Builds against the fixture and asserts the funnel invariants, the
      # drop-off arithmetic and the privacy boundary. Nothing reaches Vercel if
      # this fails.
      - name: Verify
        run: node scripts/verify.mjs

      - name: Build from the live feed
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
        run: node scripts/build.mjs

      # Committing aggregates does three jobs: git history becomes the time series,
      # repo activity keeps the cron alive (GitHub disables schedules after 60 days
      # of inactivity), and you keep a plain-text record if the Airtable base is
      # ever lost.
      - name: Commit summary if it changed
        run: |
          if [[ -n "$(git status --porcelain data/summary.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/summary.json
            git commit -m "chore: refresh tracker summary [skip ci]"
            git push
          else
            echo "No change in aggregates."
          fi

      # Catches a broken template render before spending a Vercel deploy on it.
      # verify.mjs already checks this at build time (see its dist/index.html
      # read) — this re-checks the actual artifact right before it's uploaded.
      - name: Validate build output
        run: |
          grep -q 'Job Search Analytics' dist/index.html || { echo "dist/index.html missing expected title"; exit 1; }
          grep -q 'apexcharts' dist/index.html || { echo "dist/index.html missing chart bundle"; exit 1; }

      # Vercel CLI, not a package.json dependency: this installs the deploy tool the
      # runner uses, same category as the old pipeline's ssh/rsync, not something the
      # dashboard app depends on at runtime.
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID as env vars is what lets the CLI
      # authenticate and deploy against the right project non-interactively, with no
      # `vercel link` step and no .vercel/project.json committed to the repo. The CLI
      # reads VERCEL_TOKEN from the environment on its own — passing the same value
      # again via --token hit a CLI parsing quirk ("Must not contain: -") on a
      # perfectly valid token, so it's deliberately left off here. Passing dist/
      # deploys exactly that folder's contents as a static site — Vercel runs no
      # build of its own, so nothing here needs the Airtable secrets a
      # Vercel-triggered build would.
      #
      # `vercel deploy --prod` prints exactly one URL to stdout: the production URL
      # of the deployment just made. Capturing it here means the smoke test below
      # checks what this run actually deployed, not a PUBLIC_URL secret that can
      # drift from reality (wrong domain, stale project, never updated).
      - name: Deploy dist/ to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(vercel deploy dist --prod --yes)
          echo "Deployed to $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Deploying without checking is just copying files. Fail the run if the live
      # page does not come back 200 with the expected marker in it.
      - name: Smoke test the live URL
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          code=$(curl -sS -o /tmp/live.html -w '%{http_code}' --retry 3 --retry-delay 3 "$DEPLOY_URL")
          echo "HTTP $code from $DEPLOY_URL"
          if [[ "$code" != "200" ]]; then
            echo "Bad status. Response body:"
            cat /tmp/live.html
            exit 1
          fi
          grep -q 'Job Search Analytics' /tmp/live.html || { echo "Page served but content is wrong"; cat /tmp/live.html; exit 1; }
          grep -q 'apexcharts' /tmp/live.html || { echo "Chart bundle missing from the page"; cat /tmp/live.html; exit 1; }
          echo "Live page looks right."
