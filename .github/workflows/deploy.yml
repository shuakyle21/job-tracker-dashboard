name: Build and deploy

on:
  # Data refresh. Minute 17 rather than 0 on purpose: GitHub's scheduler is busiest
  # on the hour and jobs queued then run latest. Treat this as "a few times a day",
  # never "at exactly this time" — Actions cron is best-effort.
  schedule:
    - cron: "17 */6 * * *"

  # Code changes.
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/deploy.yml"

  # Manual run from the Actions tab — how you'll test the first deploy.
  workflow_dispatch:

  # Event-driven refresh. n8n POSTs here after it writes new rows, so the dashboard
  # updates within seconds of an email arriving instead of waiting for the cron.
  repository_dispatch:
    types: [tracker-updated]

permissions:
  contents: write   # to commit data/summary.json

# A scheduled run and a dispatch can overlap. Let the newer one win rather than
# racing two deploys against the same Vercel project.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Gate. Builds against the fixture and asserts the funnel invariants, the
      # drop-off arithmetic and the privacy boundary. Nothing reaches Vercel if
      # this fails.
      - name: Verify
        run: node scripts/verify.mjs

      - name: Build from the live feed
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
        run: node scripts/build.mjs

      # Committing aggregates does three jobs: git history becomes the time series,
      # repo activity keeps the cron alive (GitHub disables schedules after 60 days
      # of inactivity), and you keep a plain-text record if the Airtable base is
      # ever lost.
      - name: Commit summary if it changed
        run: |
          if [[ -n "$(git status --porcelain data/summary.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/summary.json
            git commit -m "chore: refresh tracker summary [skip ci]"
            git push
          else
            echo "No change in aggregates."
          fi

      # Vercel CLI, not a package.json dependency: this installs the deploy tool the
      # runner uses, same category as the old pipeline's ssh/rsync, not something the
      # dashboard app depends on at runtime.
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # VERCEL_ORG_ID/VERCEL_PROJECT_ID as env vars is what lets the CLI deploy
      # against the right project non-interactively, with no `vercel link` step and
      # no .vercel/project.json committed to the repo. Passing dist/ deploys exactly
      # that folder's contents as a static site — Vercel runs no build of its own,
      # so nothing here needs the Airtable secrets a Vercel-triggered build would.
      - name: Deploy dist/ to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy dist --prod --token="$VERCEL_TOKEN" --yes

      # Deploying without checking is just copying files. Fail the run if the live
      # page does not come back 200 with the expected marker in it.
      - name: Smoke test the live URL
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          code=$(curl -sS -o /tmp/live.html -w '%{http_code}' --retry 3 --retry-delay 3 "$PUBLIC_URL")
          echo "HTTP $code"
          [[ "$code" == "200" ]] || { echo "Bad status"; exit 1; }
          grep -q 'Job Search Analytics' /tmp/live.html || { echo "Page served but content is wrong"; exit 1; }
          grep -q 'apexcharts' /tmp/live.html || { echo "Chart bundle missing from the page"; exit 1; }
          echo "Live page looks right."
